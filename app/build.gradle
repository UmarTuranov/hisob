plugins { id 'com.android.application' }

android {
    namespace 'local.expenses'
    compileSdk 35
    defaultConfig {
        applicationId 'local.expenses'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.1.0'
        testInstrumentationRunner 'local.expenses.LedgerChecks'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas"]
            }
        }
    }
    signingConfigs {
        local {
            storeFile rootProject.file('.local/signing.jks')
            storePassword 'android'
            keyAlias 'debug'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { if (rootProject.file('.local/signing.jks').exists()) signingConfig signingConfigs.local }
        release { if (rootProject.file('.local/signing.jks').exists()) signingConfig signingConfigs.local; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
}
